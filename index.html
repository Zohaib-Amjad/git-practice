<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #1f2937, #111827);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: #ffffff;
        width: 320px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .banner {
        height: 90px;
        background: linear-gradient(120deg, red, black);
      }

      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #d1d5db;
        border: 4px solid #fff;
        margin: -45px auto 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }

      .info {
        padding: 15px 20px 25px;
      }

      .info h2 {
        color: #111827;
        margin-bottom: 4px;
      }

      .info p.role {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 15px;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        border-top: 1px solid #e5e7eb;
        padding-top: 15px;
        margin-bottom: 15px;
      }

      .stats div h3 {
        color: #111827;
        font-size: 18px;
      }

      .stats div span {
        color: #6b7280;
        font-size: 12px;
      }

      .btn {
        display: inline-block;
        padding: 10px 24px;
        background: #6366f1;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        transition: background 0.2s ease;
      }

      .btn:hover {
        background: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="banner"></div>
      <div class="avatar">🚀</div>
      <div class="info">
        <h2 style="color: green">Ali Raza</h2>
        <p class="role">Frontend Developer</p>

        <div class="stats">
          <div>
            <h3>24</h3>
            <span>Projects</span>
          </div>
          <div>
            <h3>1.2k</h3>
            <span>Followers</span>
          </div>
          <div>
            <h3>340</h3>
            <span>Following</span>
          </div>
        </div>

        <div style="margin-top: 15px; text-align: left">
          <strong style="font-size: 13px; color: #374151">Skills</strong>
          <p style="font-size: 12px; color: #6b7280; margin-top: 5px">
            HTML, CSS, JavaScript, Git
          </p>
        </div>

        <a href="#" class="btn">Contact Me</a>
        <p
          style="
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #9ca3af;
          "
        >
          Made with Git practice
        </p>
      </div>
    </div>
  </body>
</html>
